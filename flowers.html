
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f8f5e9">
    <title>Un ramo para ti</title>

    <style>
		
/* Petalos cayendo */
.petal-fall {
    position: fixed;
    top: -30px;
    z-index: 5;
    color: #c40024;
    font-size: var(--size);
    pointer-events: none;
    opacity: 0;
    animation: falling var(--duration) linear var(--delay) infinite;
}

@keyframes falling {
    0% {
        transform: translateY(-30px) rotate(0deg);
        opacity: 0;
    }

    10% {
        opacity: 0.9;
    }

    90% {
        opacity: 0.8;
    }

    100% {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
    }
}
        :root {
            font-family: Georgia, "Times New Roman", serif;
            color: #294637;
            background:  #fce7ef;
}

        * {
            box-sizing: border-box;
        }

        body {
           body {
    min-height: 100vh;
    margin: 0;
    overflow: hidden;
    background:
        radial-gradient(ellipse at 50% 40%, #fffafd 0%, transparent 65%),
        radial-gradient(ellipse at 10% 90%, #f7cbdc 0%, transparent 40%),
        radial-gradient(ellipse at 90% 10%, #f9d8e5 0%, transparent 40%),
        #fce7ef;
}
        }

        main {
            display: grid;
            min-height: 100svh;
            grid-template-rows: auto minmax(0, 1fr) auto;
            justify-items: center;
            padding: clamp(22px, 5vh, 48px) 18px 24px;
            text-align: center;
        }

        header, footer {
            z-index: 2;
        }

        .eyebrow {
            margin: 0 0 10px;
            color: #78886a;
            font: 600 0.72rem/1.2 "Segoe UI", sans-serif;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            color: #345b3d;
            font-size: clamp(2rem, 6vw, 3.7rem);
            font-weight: 400;
        }

        .scene {
            position: relative;
            width: min(100%, 560px);
            min-height: 0;
            align-self: stretch;
            isolation: isolate;
        }

        .glow {
            position: absolute;
            z-index: -1;
            inset: 9% 9% 7%;
            border-radius: 50%;
            background: radial-gradient(ellipse, rgb(255 233 132 / 32%), transparent 68%);
            filter: blur(12px);
            animation: glow 4s ease-in-out infinite alternate;
        }

        .stems {
            position: absolute;
            z-index: -1;
            left: 50%;
            bottom: 4%;
            width: 47%;
            height: 43%;
            overflow: visible;
            transform: translateX(-50%);
            opacity: 0;
            animation: stems-in 1.5s 2.4s ease-out forwards;
        }

        .stems path {
            fill: none;
            stroke: #668451;
            stroke-linecap: round;
            stroke-width: 3;
        }

        .ribbon {
            position: absolute;
            z-index: 1;
            bottom: 8%;
            left: 50%;
            width: 42px;
            height: 25px;
            opacity: 0;
            transform: translateX(-50%) scale(0.6);
            animation: ribbon-in 0.7s 3.1s cubic-bezier(.2,.8,.2,1.4) forwards;
        }

        .ribbon::before,
        .ribbon::after {
            position: absolute;
            top: 2px;
            width: 20px;
            height: 16px;
            border: 2px solid #b45d49;
            border-radius: 12px 12px 3px 12px;
            content: "";
        }

        .ribbon::before {
            left: 0;
            transform: rotate(24deg);
        }

        .ribbon::after {
            right: 0;
            transform: scaleX(-1) rotate(24deg);
        }

        .ribbon span {
            position: absolute;
            top: 7px;
            left: 17px;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #b45d49;
        }

        .flower {
            position: absolute;
            top: var(--top);
            left: var(--left);
            width: 1em;
            height: 1em;
            font-size: var(--size);
            opacity: 0;
            transform: translate(-50%, 85vh) scale(0.12) rotate(-35deg);
            animation: bloom 1.15s var(--delay) cubic-bezier(.16,.72,.24,1.12) forwards;
        }

        .petal {
            position: absolute;
            top: 0.04em;
            left: 0.31em;
            width: 0.38em;
            height: 0.55em;
            border-radius: 55% 55% 48% 48%;
            background: linear-gradient(150deg, #ff4545, #a80000 82%);
            transform: rotate(var(--angle)) translateY(-0.13em);
            transform-origin: 50% 0.39em;
            box-shadow: inset -0.04em -0.04em 0 rgb(0 0 0 / 12%);
        }

        .center {
            position: absolute;
            top: 0.34em;
            left: 0.34em;
            width: 0.32em;
            height: 0.32em;
            border: 0.035em solid #a80000;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #fff1a5, #d98e15 82%);
        }

        footer {
            padding-top: 4px;
            color: #627466;
            font-size: 1rem;
            font-style: italic;
        }

        @keyframes bloom {
            0% {
                opacity: 0;
                transform: translate(-50%, 85vh) scale(0.12) rotate(-35deg);
            }
            70% {
                opacity: 1;
            }
            100% {
                opacity: 1;
                transform: translate(-50%, 0) scale(1) rotate(0);
            }
        }

        @keyframes stems-in {
            to { opacity: 0.92; }
        }

        @keyframes ribbon-in {
            to {
                opacity: 1;
                transform: translateX(-50%) scale(1);
            }
        }

        @keyframes glow {
            to {
                opacity: 0.58;
                transform: scale(1.08);
            }
        }

        @media (max-width: 480px) {
             body {
        overflow-x: hidden;
        overflow-y: auto;
    }

    		main {
        	min-height: 100svh;
        	padding: 25px 8px;

            .scene {
    		width: 100%;
       		 min-height: 350px;
			}
            }

            .flower {
                font-size: calc(var(--size) * 0.75);
            }
			 h1 {
        font-size: 2.3rem;
    	}
		}
		 footer {
        font-size: 0.9rem;
    }


        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-delay: 0ms !important;
                animation-iteration-count: 1 !important;
            }

            .flower {
                opacity: 1;
                transform: translate(-50%, 0) scale(1);
            }

            .stems, .ribbon {
                opacity: 1;
            }
        }

		/* Ocultar completamente el ramo */
.stems,
.ribbon {
    display: none !important;
}


/* Destellos modernos */
.sparkle {
    position: absolute;
    z-index: 3;
    color: #d6a83f;
    font-size: var(--size);
    pointer-events: none;
    opacity: 0;
    text-shadow:
        0 0 5px #fff2b0,
        0 0 12px #e5bd62,
        0 0 20px #ffffff;
    animation: sparkle var(--duration) ease-in-out var(--delay) infinite;
}

@keyframes sparkle {
    0%, 100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.2) rotate(0deg);
    }

    50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.2) rotate(90deg);
    }
}

/* Destellos al tocar la pantalla */
.tap-sparkle {
    position: fixed;
    z-index: 20;
    pointer-events: none;
    color: #e2b94f;
    font-size: var(--size);
    text-shadow:
        0 0 6px #fff2b0,
        0 0 15px #e5bd62;
    animation: tapEffect 900ms ease-out forwards;
}

@keyframes tapEffect {
    0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.2) rotate(0deg);
    }

    100% {
        opacity: 0;
        transform:
            translate(
                calc(-50% + var(--move-x)),
                calc(-50% + var(--move-y))
            )
            scale(1.5)
            rotate(180deg);
    }
}

    </style>
</head>

<body>
    <main>
        <header>
            <p class="eyebrow">Un detalle para el H O M B R E</p>
            <h1>CACHUDAAAA</h1>
        </header>

        <section class="scene" aria-label="Rosas rojas formando el nombre Melany">
            <div class="glow" aria-hidden="true"></div>

            <svg class="stems" viewBox="0 0 200 180" aria-hidden="true">
                <path d="M100 170 Q96 112 48 50 M100 170 Q98 105 75 29 M100 170 Q105 105 105 25 M100 170 Q111 105 133 31 M100 170 Q126 112 157 52 M100 170 Q77 118 30 79 M100 170 Q133 117 171 78" />
                <path d="M79 141 Q57 119 48 126 Q57 145 79 141 M111 147 Q133 123 149 130 Q139 149 111 147 M91 117 Q70 95 56 101 Q64 120 91 117 M119 119 Q139 94 153 101 Q143 121 119 119" fill="#8ba66d" stroke="#668451" stroke-width="1.5" />
            </svg>

            <div class="ribbon" aria-hidden="true"><span></span></div>
            <div class="flowers" aria-hidden="true"></div>
        </section>
    </main>

    <script>
        const flowerLayer = document.querySelector(".flowers");
        const flowers = [];

        let seed = 37;

        function random() {
            seed = (seed * 16807) % 2147483647;
            return (seed - 1) / 2147483646;
        }

        // Configuración del nombre
        const name = "MELANY";
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        canvas.width = 1000;
        canvas.height = 280;

        ctx.fillStyle = "white";
        ctx.font = "bold 155px Georgia";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.letterSpacing = "0.2em";
        ctx.fillText(name, 500, 140);

        const pixels = ctx.getImageData(0, 0, 1000, 280).data;

        // Distribución de rosas dentro de las letras
        for (let y = 40; y < 240; y += 5) {
            for (let x = 0; x < 1000; x += 5) {
                const index = (y * 1000 + x) * 4;

                if (pixels[index + 3] > 128 && random() > 0.02) {
                    flowers.push({
                        x: ((x - 500) / 500) * 0.92,
                        y: ((140 - y) / 140) * 0.65,
                        size: 12 + random() * 8,
                        delay: random() * 2.2
                    });
                }
            }
        }

       
// Crear pétalos que caen (SOLO 25 EN TOTAL)
for (let i = 0; i < 65; i++) {
    const petal = document.createElement("span");

    petal.className = "petal-fall";
    petal.textContent = "🌹";

    petal.style.left = Math.random() * 100 + "vw";
    petal.style.setProperty("--size", (16 + Math.random() * 18) + "px");
    petal.style.setProperty("--duration", (4 + Math.random() * 5) + "s");
    petal.style.setProperty("--delay", (Math.random() * 10) + "s");

    document.body.appendChild(petal);
}

// Crear y animar las rosas
flowers.forEach((flower) => {
    const bloom = document.createElement("span");
    bloom.className = "flower";

    bloom.style.setProperty("--left", `${50 + flower.x * 37}%`);
    bloom.style.setProperty("--top", `${49 - flower.y * 37}%`);
    bloom.style.setProperty("--size", `${flower.size}px`);
    bloom.style.setProperty("--delay", `${flower.delay}s`);

    for (let petal = 0; petal < 8; petal++) {
        const shape = document.createElement("span");
        shape.className = "petal";
        shape.style.setProperty("--angle", `${petal * 45}deg`);
        bloom.append(shape);
    }

    const center = document.createElement("span");
    center.className = "center";
    bloom.append(center);

    flowerLayer.append(bloom);
});


// Crear destellos alrededor de las rosas
const scene = document.querySelector(".scene");

for (let i = 0; i < 40; i++) {
    const sparkle = document.createElement("span");

    sparkle.className = "sparkle";
    sparkle.textContent = "✦";

    sparkle.style.left = `${8 + random() * 84}%`;
    sparkle.style.top = `${10 + random() * 75}%`;

    sparkle.style.setProperty(
        "--size",
        `${8 + random() * 13}px`
    );

    sparkle.style.setProperty(
        "--duration",
        `${1.5 + random() * 3}s`
    );

    sparkle.style.setProperty(
        "--delay",
        `${random() * 4}s`
    );

    scene.append(sparkle);
}

// Destellos al tocar o hacer clic
document.addEventListener("pointerdown", function(event) {

    for (let i = 0; i < 9; i++) {
        const sparkle = document.createElement("span");

        sparkle.className = "tap-sparkle";
        sparkle.textContent = i % 2 === 0 ? "✦" : "✧";

        sparkle.style.left = `${event.clientX}px`;
        sparkle.style.top = `${event.clientY}px`;

        sparkle.style.setProperty(
            "--size",
            `${10 + Math.random() * 15}px`
        );

        sparkle.style.setProperty(
            "--move-x",
            `${Math.random() * 100 - 50}px`
        );

        sparkle.style.setProperty(
            "--move-y",
            `${Math.random() * 100 - 50}px`
        );

        document.body.appendChild(sparkle);

        setTimeout(() => {
            sparkle.remove();
        }, 900);
    }
});

</script>
</body>
</html>
